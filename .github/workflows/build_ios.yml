name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS Package
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Mock .env File
        run: |
          touch .env
          echo "SUPABASE_URL=https://athyhvrbkonrekwzixyo.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=dummy_key" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || true

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 PolitiaApp-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolitiaApp-iOS-Build
          path: PolitiaApp-unsigned.ipa
          retention-days: 7

name: politia
description: "A production-ready cross-platform application targeting Android, iOS, Windows, macOS, Linux, and Web."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  connectivity_plus: ^7.3.1
  lottie: ^3.5.1
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
    - .env

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel/Cinzel-Bold.ttf
          weight: 700
